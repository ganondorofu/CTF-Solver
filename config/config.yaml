# ==========================================
# CTF Solver メイン設定ファイル（v2: 自律モード）
# ==========================================

# CTFdプラットフォーム接続設定
ctfd:
  url: "${CTFD_URL}"                # CTFdのURL（.envから読み込み）
  token: "${CTFD_TOKEN}"            # CTFd APIトークン（.envから読み込み）
  ended: true                      # true にするとCTF終了扱い（全エージェント停止）

# ヒント取得設定
hints:
  enabled: true
  allow_cost_hints: false           # コスト付きヒントを取得するか（false=無料のみ）
  max_cost: 0                       # 許容する最大コスト（0=無料のみ）

# 配布ファイル設定
files:
  max_size: 1000                    # 最大ファイルサイズ（MB）

# ログアーカイブ設定
logs:
  archive_on_start: true            # 起動時に古いログをアーカイブ
  keep_archives: 10                 # 保持するアーカイブ数（古いものは自動削除）
